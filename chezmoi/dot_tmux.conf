# detach-on-destroy off: when a session is killed (or the last window in
# it closes), a client attached to it gets moved to another existing
# session instead of being kicked out to the outer shell entirely. Most
# relevant here for the tmux-session-cap logic in dot_zshrc.tmpl (SSH
# auto-attach falls back to "main" once 3+ sessions exist) — this way,
# if the session a client's attached to ever gets cleaned up, that
# client lands on another live session rather than getting dropped.
set -g detach-on-destroy off

# mouse on: trackpad/mouse scroll auto-enters copy-mode and scrolls
# tmux's scrollback, click selects panes, drag resizes them. Trade-off:
# your terminal's own native text selection (for copy/paste outside
# tmux) now needs a modifier held while dragging to bypass tmux's mouse
# capture -- typically Shift+drag (iTerm2, most terminals), sometimes
# Option+drag depending on the terminal/its settings.
set -g mouse on

# Claude Code's TUI doesn't use the terminal's alternate-screen buffer,
# so without these, tmux falls back to translating mouse-wheel scroll
# into Up/Down arrow keypresses forwarded to the foreground app --
# Claude Code's input box then reads those as "recall previous prompt"
# (readline-style history), not "scroll the conversation". These let
# tmux properly distinguish/forward extended key events (including real
# mouse events) instead of down-converting them to plain arrow keys.
# Per Claude Code's own docs: https://code.claude.com/docs/en/terminal-config.md#configure-tmux
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
