# detach-on-destroy off: when a session is killed (or the last window in
# it closes), a client attached to it gets moved to another existing
# session instead of being kicked out to the outer shell entirely. Most
# relevant here for the tmux-session-cap logic in dot_zshrc.tmpl (SSH
# auto-attach falls back to "main" once 3+ sessions exist) — this way,
# if the session a client's attached to ever gets cleaned up, that
# client lands on another live session rather than getting dropped.
set -g detach-on-destroy off
