services:
  cryptpad:
    image: cryptpad/cryptpad:version-2026.5.1
    container_name: cryptpad
    restart: unless-stopped
    environment:
      # Two distinct origins for CryptPad's own content-isolation model —
      # "unsafe" (main UI) vs "safe" (sandboxed pad content). Each gets
      # its own tailscale serve port; see ../../HOMELAB.md.
      - CPAD_MAIN_DOMAIN=https://6l.seahorse-enigmatic.ts.net:8443
      - CPAD_SANDBOX_DOMAIN=https://6l.seahorse-enigmatic.ts.net:8444
      - CPAD_CONF=/cryptpad/config/config.js
    volumes:
      - /home/am/services/state/cryptpad/blob:/cryptpad/blob
      - /home/am/services/state/cryptpad/block:/cryptpad/block
      - /home/am/services/state/cryptpad/data:/cryptpad/data
      - /home/am/services/state/cryptpad/files:/cryptpad/datastore
      - /home/am/services/state/cryptpad/customize:/cryptpad/customize
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      # Host-side 3010 (not 3000 — already taken by Forgejo's web UI).
      # IMPORTANT: with httpSafeOrigin set (two real domains/ports for
      # main+sandbox), CryptPad does NOT listen on a second port for the
      # sandbox — it's the SAME server on this one port, distinguishing
      # main vs. sandbox purely by the Host header of the incoming
      # request. The httpPort+1 (3001) "sandbox port" only exists when
      # httpSafeOrigin is unset (single-domain dev mode) — do not map
      # it here, nothing listens on it in this configuration.
      - "127.0.0.1:3010:3000"     # main app — both :8443 and :8444 tailscale-serve to this
      - "127.0.0.1:3013:3003"     # websocket — /cryptpad_websocket path on both ports
